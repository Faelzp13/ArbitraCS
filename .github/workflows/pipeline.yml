name: ArbitraCS Pipeline

on:
  schedule:
    - cron: '0 */1 * * *' # Executa automaticamente a cada 1 hora
  workflow_dispatch: # Permite disparo manual na interface do GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary # Garante suporte ao PostgreSQL/Supabase no Actions

      - name: Extração Bronze
        env:
          AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
        run: python src/ingestion/02_price_extractor.py

      - name: Processamento Silver
        env:
          AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
        run: python src/transformation/03_silver_processor.py

      - name: Carga Gold (Supabase PostgreSQL)
        env:
          AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }} # Alterado para injetar a string do Supabase que o código lê
        run: python src/transformation/04_gold_loader.py